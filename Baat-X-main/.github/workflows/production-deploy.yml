name: Production Deploy

# Full gated pipeline:
# checkout -> lint -> format -> tests -> security scan -> Android AAB ->
# docker build -> container scan -> terraform validate/plan -> manual approval ->
# apply -> migrations -> smoke tests

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  id-token: write        # OIDC federation - no long-lived Azure credentials
  packages: write

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
  API_IMAGE: baatx-api
  WORKER_IMAGE: baatx-worker
  TARGET_ENV: ${{ github.event.inputs.environment || 'prod' }}

jobs:
  # 1-6: quality gates -------------------------------------------------------
  verify:
    name: Test and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Lint
        run: ruff check app tests
        working-directory: backend

      - name: Formatting check
        run: ruff format --check app tests
        working-directory: backend

      - name: Unit and API tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: ci-only-secret
          LLM_PROVIDER: "null"
          STT_PROVIDER: "null"
          STORAGE_PROVIDER: local
        run: pytest -q

      - name: Security scan
        working-directory: backend
        run: |
          pip install bandit pip-audit
          bandit -r app -ll
          pip-audit -r requirements.txt --strict

  # 7: Android release artifact ---------------------------------------------
  android:
    name: Build signed AAB
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        # Signing material lives only in GitHub secrets, never in git.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build release bundle (AAB)
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BAATX_API_BASE_URL: ${{ vars.BAATX_API_BASE_URL }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: baatx-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # 8-9: container build and scan -------------------------------------------
  images:
    name: Build, scan and push images
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ vars.ACR_NAME }}

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push images
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ steps.meta.outputs.tag }}

  # 10-11: infrastructure plan ----------------------------------------------
  terraform_plan:
    name: Terraform validate and plan
    runs-on: ubuntu-latest
    needs: [images]
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform init
      - run: terraform fmt -check -recursive ../../
      - run: terraform validate

      - name: Plan
        env:
          ARM_USE_OIDC: true
          TF_VAR_api_image: "${{ env.REGISTRY }}/${{ env.API_IMAGE }}:${{ needs.images.outputs.tag }}"
          TF_VAR_worker_image: "${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}:${{ needs.images.outputs.tag }}"
          TF_VAR_azure_speech_key: ${{ secrets.AZURE_SPEECH_KEY }}
        run: terraform plan -input=false -out=tfplan -var-file=terraform.tfvars

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'prod' }}/tfplan
          retention-days: 5

  # 12-14: approval, apply, migrations, smoke tests --------------------------
  deploy:
    name: Approve and deploy
    runs-on: ubuntu-latest
    needs: [terraform_plan, images, android]
    # Configure this GitHub environment with required reviewers to gate the job.
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.outputs.outputs.api_url }}
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: infrastructure/terraform/environments/${{ github.event.inputs.environment || 'prod' }}

      - run: terraform init
      - name: Apply
        env:
          ARM_USE_OIDC: true
        run: terraform apply -input=false -auto-approve tfplan

      - id: outputs
        run: echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az containerapp exec \
            --name ca-api-baatx-${{ env.TARGET_ENV }} \
            --resource-group "$RG" \
            --command "alembic upgrade head"

      - name: Smoke tests
        run: |
          API="${{ steps.outputs.outputs.api_url }}"
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$API/health") && [ "$code" = "200" ] && break
            sleep 10
          done
          curl -fsS "$API/health" | grep -q '"status":"ok"'
          curl -fsS "$API/ready" | grep -q '"database":"ok"'
          # Unauthenticated access to tenant data must be rejected.
          code=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/v1/customers")
          [ "$code" = "401" ] || { echo "auth gate failed: $code"; exit 1; }
          echo "Smoke tests passed against $API"