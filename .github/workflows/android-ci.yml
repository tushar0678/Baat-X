name: Android CI
on:
  push:
    branches: [main, develop]
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:
permissions:
  contents: write   # needed once to auto-commit the wrapper if it's missing
defaults:
  run:
    working-directory: android
jobs:
  # ==========================================
  # JOB 0: ENSURE WRAPPER (self-healing, no local machine needed)
  # ==========================================
  # If gradlew/gradle-wrapper.jar are already committed, this job just
  # validates their checksum and does nothing else. If they are missing
  # (e.g. first run after this pipeline change), it generates them on
  # GitHub's runner - never on your local machine, so the PowerShell
  # execution-policy error you hit locally cannot happen here - and commits
  # them back so every future run (and every teammate) gets the pinned
  # version instead of the runner's system Gradle.
  ensure-wrapper:
    name: Ensure Gradle Wrapper
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.check.outputs.generated }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether wrapper already exists
        id: check
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.generated == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.generated == 'true'

      - name: Generate wrapper (first run only)
        if: steps.check.outputs.generated == 'true'
        run: gradle wrapper --gradle-version 8.9

      - name: Commit generated wrapper
        if: steps.check.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          git commit -m "chore: commit Gradle wrapper (auto-generated by CI)"
          git push

      # Validates the wrapper jar's checksum against Gradle's official
      # signature - protects against a tampered wrapper being committed or
      # injected upstream. Runs whether the wrapper was just generated above
      # or already existed from a previous run.
      - uses: gradle/actions/wrapper-validation@v4

  # ==========================================
  # JOB 1: LINT (Code Quality Check)
  # ==========================================
  lint:
    name: Code Quality (Lint)
    needs: ensure-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}   # picks up the wrapper commit above

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Inject Secrets into keystore.properties
        run: |
          echo "BAATX_API_BASE_URL=${{ secrets.BAATX_API_BASE_URL }}" > keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Static Analysis
        run: ./gradlew lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-*.html

  # ==========================================
  # JOB 2: TEST (Unit Testing)
  # ==========================================
  test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Inject Secrets into keystore.properties
        run: |
          echo "BAATX_API_BASE_URL=${{ secrets.BAATX_API_BASE_URL }}" > keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/**

  # ==========================================
  # JOB 3: BUILD APK (Generates the App)
  # ==========================================
  build-apk:
    name: Build Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Inject Secrets into keystore.properties
        run: |
          echo "BAATX_API_BASE_URL=${{ secrets.BAATX_API_BASE_URL }}" > keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: baatx-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7