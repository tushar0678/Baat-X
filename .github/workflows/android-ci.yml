name: Android CI
on:
  workflow_dispatch:
# --- automatic triggers disabled - uncomment to re-enable ---
# on:
#   push:
#     branches: [main, develop]
#     paths: ["android/**", ".github/workflows/android-ci.yml"]
#   pull_request:
#     paths: ["android/**", ".github/workflows/android-ci.yml"]
permissions:
  contents: write   
defaults:
  run:
    working-directory: android
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:

  ensure-wrapper:
    name: Ensure Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check whether wrapper already exists
        id: check
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.generated == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.generated == 'true'

      - name: Generate wrapper (first run only)
        if: steps.check.outputs.generated == 'true'
        run: gradle wrapper --gradle-version 8.11.1

      - name: Commit generated wrapper
        if: steps.check.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          git commit -m "chore: commit Gradle wrapper (auto-generated by CI)"
          git push

      # Validates the wrapper jar's checksum against Gradle's official
      # signature - protects against a tampered wrapper being committed or
      # injected upstream.
      - uses: gradle/actions/wrapper-validation@v4

  # ==========================================
  # JOB 1: LINT + TEST + BUILD (merged into one job)
  # ==========================================
  # Previously three separate jobs, each paying its own checkout / Java
  # setup / Gradle cache-restore cost and each re-running a fresh `gradlew`
  # invocation from scratch. Running all three tasks in a single Gradle
  # invocation lets Gradle configure the project once and share the
  # upstream tasks (compileDebugKotlin, kspDebugKotlin, resource merging,
  # etc.) across lint, unit tests, and the APK build instead of redoing
  # them three times - this is the biggest time saver here.
  build-and-verify:
    name: Lint, Test & Build APK
    needs: ensure-wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}   # picks up the wrapper commit above
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Inject Secrets into keystore.properties
        run: |
          echo "BAATX_API_BASE_URL=${{ secrets.BAATX_API_BASE_URL }}" > keystore.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint, test and assemble (single Gradle invocation)
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --build-cache --parallel

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/tests/**

      - uses: actions/upload-artifact@v4
        with:
          name: baatx-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
